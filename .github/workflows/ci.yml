name: macOS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Host architecture
        run: uname -m
      - name: Native media and recovery checks
        run: swift run LumaRecChecks
      - name: Validate bilingual catalogs
        run: python3 scripts/check-localization.py
      - name: Universal app, ZIP and DMG
        run: ./scripts/build-app.sh --archive
      - name: Exercise final extracted DMG
        run: ./scripts/verify-package.sh "$PWD/dist/LumaRec-1.0.0-macOS-universal.dmg" "$RUNNER_TEMP/dmg-evidence"
      - name: Exercise final extracted ZIP
        run: ./scripts/verify-package.sh "$PWD/dist/LumaRec-1.0.0-macOS-universal.zip" "$RUNNER_TEMP/zip-evidence"
      - uses: actions/upload-artifact@v4
        with:
          name: LumaRec-macOS-universal-${{ matrix.os }}-candidate
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.txt
            ${{ runner.temp }}/dmg-evidence
            ${{ runner.temp }}/zip-evidence
